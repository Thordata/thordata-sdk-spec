# spec/v1/locations.yaml
# Locations API endpoints (SDK-aligned)

# Base URL is controlled by THORDATA_LOCATIONS_BASE_URL
# Default: https://openapi.thordata.com/api/locations

auth:
  headers:
    token: "publicToken"
    key: "publicKey"

countries:
  endpoint: "/countries"
  baseUrlRef: "locations"
  method: "GET"
  params:
    - proxy_type

states:
  endpoint: "/states"
  baseUrlRef: "locations"
  method: "GET"
  params:
    - proxy_type
    - country_code

cities:
  endpoint: "/cities"
  baseUrlRef: "locations"
  method: "GET"
  params:
    - proxy_type
    - country_code
    - state_code

asn:
  endpoint: "/asn"
  baseUrlRef: "locations"
  method: "GET"
  params:
    - proxy_type
    - country_code

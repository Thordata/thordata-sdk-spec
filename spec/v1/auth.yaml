# spec/v1/auth.yaml
# Authentication modes and credential requirements for all Thordata APIs
# SDK-aligned (Python is the reference implementation)

credentials:
  scraperToken:
    envVar: "THORDATA_SCRAPER_TOKEN"
    source: "Dashboard"
    required: false
    usedBy: ["serp", "webunlocker", "builder", "videoBuilder"]

  publicToken:
    envVar: "THORDATA_PUBLIC_TOKEN"
    source: "Dashboard"
    required: false
    usedBy: ["publicApi", "locations", "tasks"]

  publicKey:
    envVar: "THORDATA_PUBLIC_KEY"
    source: "Dashboard"
    required: false
    usedBy: ["publicApi", "locations", "tasks"]

  browserUsername:
    envVar: "THORDATA_BROWSER_USERNAME"
    source: "Dashboard"
    required: false
    usedBy: ["browser"]

  browserPassword:
    envVar: "THORDATA_BROWSER_PASSWORD"
    source: "Dashboard"
    required: false
    usedBy: ["browser"]

# Authentication modes for SERP / Web Unlocker
serpWebunlockerAuth:
  modes:
    bearer:
      header: "Authorization"
      format: "Bearer {scraperToken}"
      default: true
    headerToken:
      header: "token"
      format: "{scraperToken}"
      default: false

apiAuth:
  serp:
    required: ["scraperToken"]
    mode: "bearer or headerToken"
    headers:
      bearer: { Authorization: "Bearer {scraperToken}" }
      headerToken: { token: "{scraperToken}" }

  webunlocker:
    required: ["scraperToken"]
    mode: "bearer or headerToken"
    headers:
      bearer: { Authorization: "Bearer {scraperToken}" }
      headerToken: { token: "{scraperToken}" }

  builder:
    required: ["scraperToken", "publicToken", "publicKey"]
    note: "Requires all three headers"
    headers:
      token: "{publicToken}"
      key: "{publicKey}"
      Authorization: "Bearer {scraperToken}"

  videoBuilder:
    required: ["scraperToken", "publicToken", "publicKey"]
    note: "Same as builder"
    headers:
      token: "{publicToken}"
      key: "{publicKey}"
      Authorization: "Bearer {scraperToken}"

  tasksStatus:
    required: ["publicToken", "publicKey"]
    headers:
      token: "{publicToken}"
      key: "{publicKey}"

  tasksDownload:
    required: ["publicToken", "publicKey"]
    headers:
      token: "{publicToken}"
      key: "{publicKey}"

  tasksList:
    required: ["publicToken", "publicKey"]
    headers:
      token: "{publicToken}"
      key: "{publicKey}"

  locations:
    required: ["publicToken", "publicKey"]
    headers:
      token: "{publicToken}"
      key: "{publicKey}"

  publicApi:
    required: ["publicToken", "publicKey"]
    headers:
      token: "{publicToken}"
      key: "{publicKey}"

  browser:
    required: ["browserUsername", "browserPassword"]
    notes:
      - "Used to build remote browser connection URLs."
      - "Python SDK applies 'td-customer-' prefix and URL-encodes credentials."

# Decision tree for SDK implementers
decisionTree:
  question: "Which API are you calling?"
  answers:
    "SERP":
      useCredential: ["scraperToken"]
      authMode: "bearer (default) or headerToken"
    "Web Unlocker":
      useCredential: ["scraperToken"]
      authMode: "bearer (default) or headerToken"
    "Web Scraper builder/video_builder":
      useCredential: ["scraperToken", "publicToken", "publicKey"]
      note: "Need all three"
    "Task status/download/list":
      useCredential: ["publicToken", "publicKey"]
    "Locations":
      useCredential: ["publicToken", "publicKey"]
    "Public API (usage, users, whitelist, proxy list)":
      useCredential: ["publicToken", "publicKey"]
    "Browser":
      useCredential: ["browserUsername", "browserPassword"]

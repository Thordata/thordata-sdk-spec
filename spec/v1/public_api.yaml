# spec/v1/public_api.yaml
# Public API endpoints for account/proxy management (token + key auth)

# NOTE: All baseUrl values below are aligned with the Python SDK implementation.
# The Python SDK uses these env-controlled bases:
# - THORDATA_LOCATIONS_BASE_URL (default: https://openapi.thordata.com/api/locations)
#   -> shared base inferred by removing '/locations' suffix
# - THORDATA_WHITELIST_BASE_URL (default: https://openapi.thordata.com/api)
# - THORDATA_PROXY_API_BASE_URL (default: https://openapi.thordata.com/api)

auth:
  headers:
    token: "publicToken"
    key: "publicKey"

# ========================================
# Account Management
# ========================================

# Account Balance
accountBalance:
  traffic:
    endpoint: "/account/traffic-balance"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
    responseFields:
      traffic_balance:
        type: "number"
        unit: "KB"

  wallet:
    endpoint: "/account/wallet-balance"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
    responseFields:
      balance:
        type: "number"
        unit: "USD"

# Account usage statistics
usageStatistics:
  endpoint: "/account/usage-statistics"
  baseUrl: "https://openapi.thordata.com/api"
  method: "GET"
  params:
    - token
    - key
    - from_date
    - to_date
  responseFields:
    total_usage_traffic:
      type: "number"
      unit: "KB"
    traffic_balance:
      type: "number"
      unit: "KB"
    query_days:
      type: "integer"
    range_usage_traffic:
      type: "number"
      unit: "KB"
    data:
      type: "array"
      description: "Daily usage breakdown"


# ========================================
# Proxy User Management
# Residential & Unlimited proxy user CRUD operations
# ========================================

proxyUsers:
  list:
    endpoint: "/proxy-users/user-list"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
      - proxy_type
    proxyTypes:
      1: "Residential"
      2: "Unlimited"
    responseFields:
      limit:
        type: "number"
        unit: "KB"
      remaining_limit:
        type: "number"
        unit: "KB"
      user_count:
        type: "integer"
      list:
        type: "array"
        items:
          username: "string"
          password: "string"
          status: "boolean"
          traffic_limit: "integer"
          usage_traffic: "number"

  create:
    endpoint: "/proxy-users/create-user"
    baseUrl: "https://openapi.thordata.com/api"
    method: "POST"
    requestFields:
      proxy_type:
        type: "integer"
        required: true
      username:
        type: "string"
        required: true
      password:
        type: "string"
        required: true
      traffic_limit:
        type: "integer"
        description: "Traffic limit in MB (0 = unlimited, min 100)"
      status:
        type: "string"
        enum: ["true", "false"]

  update:
    endpoint: "/proxy-users/update-user"
    baseUrl: "https://openapi.thordata.com/api"
    method: "POST"
    requestFields:
      proxy_type:
        type: "integer"
        required: true
      username:
        type: "string"
        required: true
      traffic_limit:
        type: "integer"
      status:
        type: "string"
        enum: ["true", "false"]

  delete:
    endpoint: "/proxy-users/delete-user"
    baseUrl: "https://openapi.thordata.com/api"
    method: "POST"
    requestFields:
      proxy_type:
        type: "integer"
        required: true
      username:
        type: "string"
        required: true

  usage:
    endpoint: "/proxy-users/usage-statistics"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
      - proxy_type
      - username
      - from_date
      - to_date

  usageHour:
    endpoint: "/proxy-users/usage-statistics-hour"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
      - proxy_type
      - username
      - from_date
      - to_date


# ========================================
# IP Whitelist Management
# Control which IPs can access your proxies
# ========================================

whitelist:
  list:
    endpoint: "/whitelisted-ips/ip-list"
    baseUrl: "https://openapi.thordata.com/api"
    method: "GET"
    params:
      - token
      - key
      - proxy_type

  addIp:
    endpoint: "/whitelisted-ips/add-ip"
    baseUrl: "https://openapi.thordata.com/api"
    method: "POST"
    requestFields:
      proxy_type:
        type: "integer"
        description: "1=Residential, 2=Unlimited, 9=Mobile"
      ip:
        type: "string"
        required: true
      status:
        type: "string"
        enum: ["true", "false"]

  deleteIp:
    endpoint: "/whitelisted-ips/delete-ip"
    baseUrl: "https://openapi.thordata.com/api"
    method: "POST"
    requestFields:
      proxy_type:
        type: "integer"
      ip:
        type: "string"
        required: true


# ========================================
# Proxy Information
# ISP and Datacenter proxy list and expiration
# ========================================

proxyList:
  endpoint: "/proxy/proxy-list"
  baseUrl: "https://openapi.thordata.com/api"
  method: "GET"
  params:
    - token
    - key
    - proxy_type
  proxyTypes:
    1: "ISP"
    2: "Datacenter"
  responseFields:
    - ip
    - port
    - username
    - password
    - expiration_time

proxyExpiration:
  endpoint: "/proxy/expiration-time"
  baseUrl: "https://openapi.thordata.com/api"
  method: "GET"
  params:
    - token
    - key
    - proxy_type
    - ips

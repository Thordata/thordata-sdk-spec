# thordata-sdk-spec/.github/workflows/docs.yml

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'v1.json'
      - 'tools/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Build OpenAPI Spec
        run: |
          python tools/build_v1_json.py --out v1.json # Ensure v1.json is fresh
          python tools/v1_to_openapi.py --spec v1.json --out docs/openapi.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
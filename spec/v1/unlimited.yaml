# spec/v1/unlimited.yaml
# Unlimited Residential Proxy management (SDK-aligned)

# Python SDK reference:
# - thordata.unlimited.UnlimitedNamespace
# - Base URL derived from THORDATA_LOCATIONS_BASE_URL by removing '/locations'
#   default: https://openapi.thordata.com/api

auth:
  headers:
    token: "publicToken"
    key: "publicKey"

baseUrl:
  derivedFrom:
    baseUrlRef: "locations"
    rule: "remove_suffix:/locations"
    example: "https://openapi.thordata.com/api"

serverList:
  endpoint: "/unlimited/server-list"
  baseUrlRefDerived: true
  method: "GET"
  params:
    - token
    - key

restart:
  endpoint: "/unlimited/restart-server"
  baseUrlRefDerived: true
  method: "POST"
  requestFields:
    plan_name:
      type: "string"
      required: true

renew:
  endpoint: "/unlimited/renew"
  baseUrlRefDerived: true
  method: "POST"
  requestFields:
    plan_name:
      type: "string"
      required: true
    month:
      type: "integer"
      required: true

upgrade:
  endpoint: "/unlimited/upgrade"
  baseUrlRefDerived: true
  method: "POST"
  requestFields:
    plan_name:
      type: "string"
      required: true
    target_plan:
      type: "string"
      required: true

serverMonitor:
  endpoint: "/unlimited/server-monitor"
  baseUrlRefDerived: true
  method: "GET"
  params:
    - token
    - key
    - ins_id
    - region
    - start_time
    - end_time
    - period
  responseNotes:
    - "Python SDK expects data.code == 200 and returns data.data"

balancingMonitor:
  endpoint: "/unlimited/balancing-monitor"
  baseUrlRefDerived: true
  method: "GET"
  params:
    - token
    - key
    - ins_id
    - region
    - start_time
    - end_time
    - period
  responseNotes:
    - "Python SDK notes this endpoint may use status_code instead of code"
    - "Python SDK returns payload field if present"

bindUser:
  list:
    endpoint: "/get_unlimited_servers_bind_user"
    baseUrlRefDerived: true
    method: "POST"
    requestFields:
      ip:
        type: "string"
        required: true
        description: "Domain or IP of unlimited proxy server"

  add:
    endpoint: "/add_unlimited_servers_bind_user"
    baseUrlRefDerived: true
    method: "POST"
    requestFields:
      ip:
        type: "string"
        required: true
      username:
        type: "string"
        required: true

  delete:
    endpoint: "/del_unlimited_servers_bind_user"
    baseUrlRefDerived: true
    method: "POST"
    requestFields:
      ip:
        type: "string"
        required: true
      username:
        type: "string"
        required: true

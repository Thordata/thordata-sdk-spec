# spec/v1/errors.yaml
# Error code definitions and precedence rules for all Thordata APIs
# SDK-aligned (Python is the reference implementation)

payload:
  successCode: 200
  codeField: "code"
  messageFieldCandidates: ["msg", "message", "error", "detail", "description"]

precedence:
  # Python SDK treats payload.code as authoritative when present.
  # If payload.code is present and not successCode, it wins over HTTP status.
  effectiveCodeRule: "payload_code_if_present_and_not_200_else_http_status"

apiCodes:
  success:
    code: 200
    billed: true
    retryable: false
    category: "success"

  notCollected:
    code: 300
    billed: false
    retryable: true
    category: "not_collected"
    description: "Request accepted but no data collected (not billed)."

httpStatus:
  validation:
    codes: [400, 404, 422]
    retryable: false
    category: "validation"

  auth:
    codes: [401, 403]
    retryable: false
    category: "auth"

  rateLimit:
    codes: [402, 429]
    retryable: true
    category: "rate_limit"
    suggestedAction: "exponential_backoff"

  server:
    codes: [500, 502, 503, 504]
    retryable: true
    category: "server"
    suggestedAction: "exponential_backoff"

# API family code sets (payload codes and/or http status codes)
serpCodes:
  - 200
  - 300
  - 400
  - 401
  - 403
  - 404
  - 429
  - 500
  - 504

webunlockerCodes:
  - 200
  - 300
  - 400
  - 401
  - 403
  - 429
  - 500
  - 504

tasksCodes:
  - 200
  - 300
  - 400
  - 401
  - 403
  - 404
  - 429
  - 500
  - 504

# Public API error codes (10000 series)
publicApiCodes:
  10000:
    message: "Parameter error"
    retryable: false
    category: "validation"
  10001:
    message: "Unknown error"
    retryable: false
    category: "unknown"
  10011:
    message: "Frequent operations, please try again later"
    retryable: true
    category: "rate_limit"
    suggestedAction: "exponential_backoff"
  10013:
    message: "public token error"
    retryable: false
    category: "auth"
  10014:
    message: "public key error"
    retryable: false
    category: "auth"
  10018:
    message: "The username already exists"
    retryable: false
    category: "validation"
  10021:
    message: "The query date cannot exceed 180 days"
    retryable: false
    category: "validation"

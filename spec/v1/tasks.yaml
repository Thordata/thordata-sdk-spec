# spec/v1/tasks.yaml
# Web Scraper Tasks API (SDK-aligned)

# IMPORTANT
# - Task creation uses scraperapi base URL (/builder, /video_builder)
# - Task status/list/download use webScraperApi base URL (/tasks-status, /tasks-list, /tasks-download)
# - Authentication (Python SDK):
#   - builder/video_builder: Bearer scraperToken + publicToken/publicKey headers
#   - status/list/download: publicToken/publicKey headers

# Text-based scraping task
builder:
  endpoint: "/builder"
  baseUrlRef: "scraperapi"
  method: "POST"
  auth:
    headers:
      token: "publicToken"
      key: "publicKey"
      AuthorizationBearer: "scraperToken"
  requestFields:
    - file_name
    - spider_id
    - spider_name
    - spider_parameters
    - spider_errors
    - spider_universal

# Video download task
videoBuilder:
  endpoint: "/video_builder"
  baseUrlRef: "scraperapi"
  method: "POST"
  auth:
    headers:
      token: "publicToken"
      key: "publicKey"
      AuthorizationBearer: "scraperToken"
  requestFields:
    - file_name
    - spider_id
    - spider_name
    - spider_parameters
    - spider_errors
    - common_settings
  commonSettings:
    description: "YouTube video/audio common settings (JSON string)"
    fields:
      resolution:
        type: "string"
        description: "Video resolution selector (SDK commonly uses expressions like '<=360p')"
      video_codec:
        type: "string"
        description: "Video codec selector (e.g., vp9, h264)"
      audio_format:
        type: "string"
        description: "Audio format selector (e.g., opus, mp3, aac)"
      bitrate:
        type: "string"
        description: "Audio bitrate selector (e.g., '<=320')"
      selected_only:
        type: "boolean"
        description: "If true, only download selected streams"

# Task list
list:
  endpoint: "/tasks-list"
  baseUrlRef: "webScraperApi"
  method: "POST"
  auth:
    headers:
      token: "publicToken"
      key: "publicKey"
  requestFields:
    - page
    - size
  responseFields:
    - count
    - list

# Task status
status:
  endpoint: "/tasks-status"
  baseUrlRef: "webScraperApi"
  method: "POST"
  auth:
    headers:
      token: "publicToken"
      key: "publicKey"
  requestFields:
    - tasks_ids

# Task download
download:
  endpoint: "/tasks-download"
  baseUrlRef: "webScraperApi"
  method: "POST"
  auth:
    headers:
      token: "publicToken"
      key: "publicKey"
  requestFields:
    - tasks_id
    - type
  downloadTypes:
    - json
    - csv
    - video
    - subtitle
    - audio

# Webhook payload definition
webhook:
  description: "Webhook events sent by Thordata when task status changes"
  events:
    - Running
    - Task Succeeded
    - Task Failed
  payload:
    taskId:
      type: "string"
      description: "Task ID"
    prodect_id:
      type: "string"
      description: "Product ID"
    apiCode:
      type: "integer"
      description: "API response code"
    apiErrorMsg:
      type: "string"
      description: "Error message if any"
    jsonUrl:
      type: "string"
      description: "JSON result download URL"
    csvUrl:
      type: "string"
      description: "CSV result download URL"
    videoUrl:
      type: "string"
      description: "Video download URL (for video tasks)"
    audioUrl:
      type: "string"
      description: "Audio download URL (for audio tasks)"
    subtitleUrl:
      type: "string"
      description: "Subtitle download URL"
    status:
      type: "string"
      description: "Task status"
    createdTime:
      type: "string"
      description: "Task creation time"
    endTime:
      type: "string"
      description: "Task completion time"

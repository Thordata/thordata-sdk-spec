# spec/v1/proxy.yaml

gateway:
  endpointEnv:
    host: THORDATA_PROXY_HOST
    port: THORDATA_PROXY_PORT
    protocol: THORDATA_PROXY_PROTOCOL
  
  notes:
    - "IMPORTANT: Most accounts require HTTPS proxy protocol"
    - "HTTP protocol is deprecated and not supported by most proxy servers"
    - "Always use dashboard-provided endpoint (e.g., vpn9wq0d.pr.thordata.net)"
    - "SDK implementations must support TLS to proxy for HTTPS protocol"
    - "For HTTPS proxy + HTTPS target: requires TLS-in-TLS (Python supported, Go/JS simplified)"
  
  # Fallback only - users should use dashboard-provided host
  defaultHost: "pr.thordata.net"

  # Dashboard provides account-specific hosts (strongly recommended)
  dashboardHostPatterns:
    - "{shard}.pr.thordata.net"      # Example: vpn9wq0d.pr.thordata.net
    - "{shard}.{region}.thordata.net"
  
  # Available regions
  regions:
    common: ["na", "eu", "as"]
    residentialExtra: ["va"]
    defaultRegionAlias: "pr"
  
  # Legacy hosts (for backward compatibility)
  compatibilityHosts:
    - "pr.thordata.net"
    - "t.pr.thordata.net"
    - "t.na.thordata.net"
    - "t.eu.thordata.net"
    - "t.as.thordata.net"
    - "dc.pr.thordata.net"
    - "m.pr.thordata.net"
    - "isp.pr.thordata.net"

protocols:
  supported:
    https:
      description: "HTTPS proxy (TLS encrypted connection to proxy)"
      required_by: "Most Thordata accounts"
      security: "TLS encryption between client and proxy"
      implementation_notes:
        - "Requires TLS handshake with proxy server"
        - "For HTTPS target: requires TLS-in-TLS (nested TLS)"
        - "Python: Full support via ssl.MemoryBIO"
        - "Go: Full support via custom dialer"
        - "JS/Node.js: Use https-proxy-agent"
      curl_example: 'curl -x "https://user:pass@host:9999" "https://ipinfo.thordata.com"'
    
    socks5h:
      description: "SOCKS5 proxy with remote DNS resolution"
      advantages:
        - "Better privacy (DNS queries via proxy)"
        - "Simpler implementation than HTTPS"
        - "No nested TLS issues"
      implementation_notes:
        - "Use 'socks5h' scheme (not 'socks5') for remote DNS"
        - "Supports both IPv4 and IPv6"
        - "Python: Use PySocks or urllib3[socks]"
        - "Go: Use golang.org/x/net/proxy"
        - "JS/Node.js: Use socks-proxy-agent"
      curl_example: 'curl -x "socks5h://user:pass@host:9999" "https://ipinfo.thordata.com"'
    
    http:
      description: "HTTP proxy (deprecated, not supported by most accounts)"
      status: deprecated
      support_level: "Legacy only"
      notes:
        - "Most Thordata proxy servers reject HTTP connections"
        - "Use HTTPS or SOCKS5 instead"
        - "curl test typically results in 'Empty reply from server'"
      curl_example: 'curl -x "http://user:pass@host:9999" "http://example.com"  # Usually fails'

upstreamProxySupport:
  description: "SDK support for proxy chaining to access Thordata from restricted networks"
  environment_variable: THORDATA_UPSTREAM_PROXY
  
  use_cases:
    mainland_china:
      description: "Users behind GFW need local proxy (Clash, V2Ray) to access Thordata"
      solution: "Set THORDATA_UPSTREAM_PROXY to local proxy address"
      example: "THORDATA_UPSTREAM_PROXY=socks5://127.0.0.1:7897"
    
    corporate_firewall:
      description: "Corporate networks blocking direct proxy connections"
      solution: "Route through corporate proxy or VPN"
    
    multi_hop_privacy:
      description: "Users requiring additional anonymity layer"
      solution: "Chain through personal VPN before Thordata"
  
  supported_upstream_protocols:
    - protocol: socks5
      recommended: true
      notes: "Best compatibility with Clash, V2Ray, Shadowsocks"
    - protocol: socks5h
      recommended: true
      notes: "Remote DNS resolution (more private)"
    - protocol: http
      recommended: false
      notes: "Basic HTTP CONNECT tunnel"
    - protocol: https
      recommended: false
      notes: "TLS to upstream proxy (complex implementation)"
  
  implementation_status:
    python:
      status: "✅ Full support"
      features:
        - "TLS-in-TLS for HTTPS proxy + HTTPS target"
        - "SOCKS5 upstream -> HTTPS/SOCKS5 Thordata proxy"
        - "HTTP upstream -> HTTPS/SOCKS5 Thordata proxy"
      implementation: "Custom socket factory with ssl.MemoryBIO"
    
    go:
      status: "✅ Full support"
      features:
        - "SOCKS5 and HTTP upstream support"
        - "Custom dialer chain"
      implementation: "golang.org/x/net/proxy with custom dial"
      notes: "Test coverage may be limited"
    
    javascript:
      status: "⚠️ Partial support"
      features:
        - "Detection and logging of upstream proxy"
        - "Works with system proxy or TUN mode"
      limitations:
        - "Full proxy chaining is complex in Node.js"
        - "Recommends using Clash TUN mode"
      recommendation: "Set Clash to TUN mode or system proxy"
  
  common_tools:
    clash_verge:
      default_ports:
        http: 7897
        socks5: 7897
      recommended_mode: "TUN mode (captures all traffic)"
      env_setting: "THORDATA_UPSTREAM_PROXY=socks5://127.0.0.1:7897"
    
    v2ray:
      default_ports:
        http: 1087
        socks5: 1080
      env_setting: "THORDATA_UPSTREAM_PROXY=socks5://127.0.0.1:1080"
    
    shadowsocks:
      default_ports:
        socks5: 1080
      env_setting: "THORDATA_UPSTREAM_PROXY=socks5://127.0.0.1:1080"

auth:
  usernamePrefix: "td-customer-"
  passwordMayBeEmpty: true
  notes:
    - "Username format: td-customer-{account}-{targeting-params}"
    - "Targeting params: country, city, session_id, etc."

products:
  residential:
    port: 9999
    recommended_protocol: "https"
  
  mobile:
    port: 5555
    recommended_protocol: "https"
  
  datacenter:
    port: 7777
    recommended_protocol: "https"
  
  isp:
    port: 6666
    mode: "direct_or_gateway"
    notes: "Static IPs use direct connection, not gateway"

credentialsEnv:
  residential:
    username: "THORDATA_RESIDENTIAL_USERNAME"
    password: "THORDATA_RESIDENTIAL_PASSWORD"
  mobile:
    username: "THORDATA_MOBILE_USERNAME"
    password: "THORDATA_MOBILE_PASSWORD"
  datacenter:
    username: "THORDATA_DATACENTER_USERNAME"
    password: "THORDATA_DATACENTER_PASSWORD"
  isp:
    host: "THORDATA_ISP_HOST"
    username: "THORDATA_ISP_USERNAME"
    password: "THORDATA_ISP_PASSWORD"

usernameSegments:
  order:
    - "continent"
    - "country"
    - "state"
    - "city"
    - "asn"
    - "sessid"
    - "sesstime"
  
  keys:
    continent: "continent"
    country: "country"
    state: "state"
    city: "city"
    asn: "asn"
    sessionId: "sessid"
    sessionDurationMinutes: "sesstime"
  
  examples:
    basic: "td-customer-myaccount"
    with_country: "td-customer-myaccount-country-us"
    with_city: "td-customer-myaccount-country-us-city-seattle"
    with_session: "td-customer-myaccount-country-us-sessid-abc123-sesstime-10"

curl_examples:
  https_proxy_success:
    command: 'curl -x "https://td-customer-user:pass@vpnXXXX.pr.thordata.net:9999" "https://ipinfo.thordata.com"'
    expected: "200 OK with IP info JSON"
    note: "This is the recommended method"
  
  socks5h_success:
    command: 'curl -x "socks5h://td-customer-user:pass@vpnXXXX.pr.thordata.net:9999" "https://ipinfo.thordata.com"'
    expected: "200 OK with IP info JSON"
    note: "Alternative to HTTPS, simpler implementation"
  
  http_fails:
    command: 'curl -x "http://td-customer-user:pass@vpnXXXX.pr.thordata.net:9999" "http://ipinfo.thordata.com"'
    expected: "Empty reply from server or connection refused"
    note: "HTTP protocol not supported by most Thordata servers"
  
  upstream_chain_example:
    description: "Using Clash as upstream proxy"
    setup:
      - "Start Clash Verge (default port 7897)"
      - "Set environment: export THORDATA_UPSTREAM_PROXY=socks5://127.0.0.1:7897"
    command: "python -c 'from thordata import ThordataClient; ...'"
    flow: "Client -> Clash (127.0.0.1:7897) -> Thordata Proxy -> Target"